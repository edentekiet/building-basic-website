<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.45}h2{margin-top:0}.q{background:white;border:1px solid #cbd5e1;border-radius:11px;padding:13px;margin:10px 0}.q p{font-weight:700;margin-top:0}label{display:block;padding:4px 0;cursor:pointer}button{border:0;border-radius:9px;padding:10px 15px;background:#0f766e;color:white;font-weight:700;cursor:pointer}#result{margin-top:12px;padding:11px;background:#ecfeff;border:1px solid #99f6e4;border-radius:10px;font-weight:700}.fb{font-size:13px;margin-top:7px;color:#475569}</style>
<style>
html,body{font-family:Arial,Helvetica,sans-serif!important;color:#233247!important}
body{background:#fff!important}
button{border-radius:8px!important}
</style>
</head><body>
<h2>CSS Knowledge Check</h2><form id="quiz"><div class="q"><p>1. Which selector targets every <section> element?</p><label><input type="radio" name="q1" value="a"> section</label><label><input type="radio" name="q1" value="b"> .section</label><label><input type="radio" name="q1" value="c"> #section</label><div class="fb" id="fb1"></div></div><div class="q"><p>2. Where is an external stylesheet normally connected?</p><label><input type="radio" name="q2" value="a"> Inside the HTML head</label><label><input type="radio" name="q2" value="b"> Inside an image alt attribute</label><label><input type="radio" name="q2" value="c"> Inside a button label</label><div class="fb" id="fb2"></div></div><div class="q"><p>3. Which property creates inside spacing?</p><label><input type="radio" name="q3" value="a"> margin</label><label><input type="radio" name="q3" value="b"> padding</label><label><input type="radio" name="q3" value="c"> href</label><div class="fb" id="fb3"></div></div><div class="q"><p>4. What can a media query do?</p><label><input type="radio" name="q4" value="a"> Apply CSS under a condition such as viewport width</label><label><input type="radio" name="q4" value="b"> Create an HTML heading</label><label><input type="radio" name="q4" value="c"> Listen for button clicks</label><div class="fb" id="fb4"></div></div><button type="submit">Check answers</button><div id="result" aria-live="polite">Complete the questions, then check your answers.</div></form>
<script>
const A={"q1": "a", "q2": "a", "q3": "b", "q4": "a"},F={"q1": "An element selector uses the element name.", "q2": "A link element in the head commonly connects styles.css.", "q3": "Padding creates space inside the element border.", "q4": "Media queries apply targeted CSS when their condition is true."};
document.getElementById("quiz").addEventListener("submit",function(e){e.preventDefault();let score=0,answered=0;Object.entries(A).forEach(([name,correct],idx)=>{const s=document.querySelector(`input[name="${name}"]:checked`);const fb=document.getElementById("fb"+(idx+1));if(s){answered++;if(s.value===correct){score++;fb.textContent="Correct. "+F[name]}else{fb.textContent="Review this idea. "+F[name]}}else{fb.textContent="Choose an answer for this question."}});document.getElementById("result").textContent=answered===Object.keys(A).length?`Score: ${score}/${Object.keys(A).length}. ${score===Object.keys(A).length?"Excellent—continue when you are ready.":"Review the feedback and try again."}`:`You answered ${answered} of ${Object.keys(A).length} questions.`;});
</script></body></html>
