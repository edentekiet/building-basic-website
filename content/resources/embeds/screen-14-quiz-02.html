<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.45}h2{margin-top:0}.q{background:white;border:1px solid #cbd5e1;border-radius:11px;padding:13px;margin:10px 0}.q p{font-weight:700;margin-top:0}label{display:block;padding:4px 0;cursor:pointer}button{border:0;border-radius:9px;padding:10px 15px;background:#0f766e;color:white;font-weight:700;cursor:pointer}#result{margin-top:12px;padding:11px;background:#ecfeff;border:1px solid #99f6e4;border-radius:10px;font-weight:700}.fb{font-size:13px;margin-top:7px;color:#475569}</style>
<style>
html,body{font-family:Arial,Helvetica,sans-serif!important;color:#233247!important}
body{background:#fff!important}
button{border-radius:8px!important}
</style>
</head><body>
<h2>JavaScript Knowledge Check</h2><form id="quiz"><div class="q"><p>1. What does the DOM represent?</p><label><input type="radio" name="q1" value="a"> The browser's page structure as objects</label><label><input type="radio" name="q1" value="b"> A CSS color</label><label><input type="radio" name="q1" value="c"> A web address</label><div class="fb" id="fb1"></div></div><div class="q"><p>2. Which method can listen for a button click?</p><label><input type="radio" name="q2" value="a"> addEventListener</label><label><input type="radio" name="q2" value="b"> font-family</label><label><input type="radio" name="q2" value="c"> href</label><div class="fb" id="fb2"></div></div><div class="q"><p>3. Which property changes an element's text?</p><label><input type="radio" name="q3" value="a"> textContent</label><label><input type="radio" name="q3" value="b"> src</label><label><input type="radio" name="q3" value="c"> margin</label><div class="fb" id="fb3"></div></div><div class="q"><p>4. Why must IDs match exactly?</p><label><input type="radio" name="q4" value="a"> JavaScript uses the ID to find the intended element</label><label><input type="radio" name="q4" value="b"> CSS stops working otherwise everywhere</label><label><input type="radio" name="q4" value="c"> HTML cannot contain text otherwise</label><div class="fb" id="fb4"></div></div><button type="submit">Check answers</button><div id="result" aria-live="polite">Complete the questions, then check your answers.</div></form>
<script>
const A={"q1": "a", "q2": "a", "q3": "a", "q4": "a"},F={"q1": "The DOM represents the loaded document so scripts can work with its elements.", "q2": "addEventListener connects an event to a callback.", "q3": "textContent updates the element's text.", "q4": "A mismatched ID can make the selection return no matching element."};
document.getElementById("quiz").addEventListener("submit",function(e){e.preventDefault();let score=0,answered=0;Object.entries(A).forEach(([name,correct],idx)=>{const s=document.querySelector(`input[name="${name}"]:checked`);const fb=document.getElementById("fb"+(idx+1));if(s){answered++;if(s.value===correct){score++;fb.textContent="Correct. "+F[name]}else{fb.textContent="Review this idea. "+F[name]}}else{fb.textContent="Choose an answer for this question."}});document.getElementById("result").textContent=answered===Object.keys(A).length?`Score: ${score}/${Object.keys(A).length}. ${score===Object.keys(A).length?"Excellent—continue when you are ready.":"Review the feedback and try again."}`:`You answered ${answered} of ${Object.keys(A).length} questions.`;});
</script></body></html>
